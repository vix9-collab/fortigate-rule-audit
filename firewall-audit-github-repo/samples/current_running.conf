config firewall policy
    edit 1
        set name "Allow_Web_Outbound"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS"
        set comments "INC0012345 - web access for finance dept"
        set logtraffic all
    next
    edit 2
        set name "Allow_Finance_DB"
        set srcintf "internal"
        set dstintf "dmz"
        set srcaddr "FINANCE_SUBNET"
        set dstaddr "DB_SERVER_10"
        set action accept
        set schedule "always"
        set service "MSSQL"
        set comments "INC0012890 - finance app to DB access"
    next
    edit 4
        set name "Allow_HR_App"
        set srcintf "internal"
        set dstintf "dmz"
        set srcaddr "HR_SUBNET"
        set dstaddr "HR_APP_SERVER"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set comments "INC0013410 - HR app rollout"
    next
    edit 5
        set name "Temp_Test_Rule"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "203.0.113.55"
        set action accept
        set schedule "always"
        set service "ALL"
        set comments "test"
    next
    edit 6
        set name "Vendor_VPN_Access"
        set srcintf "wan1"
        set dstintf "internal"
        set srcaddr "VENDOR_HOST"
        set dstaddr "APP_SERVER_02"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
    edit 7
        set name "Deny_All_Dup1"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set comments "default deny"
    next
    edit 8
        set name "Deny_All_Dup2"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
    next
    edit 9
        set name "Deny_All_Dup3"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
    next
    edit 10
        set name "Allow_HR_App_Dup"
        set srcintf "internal"
        set dstintf "dmz"
        set srcaddr "HR_SUBNET"
        set dstaddr "HR_APP_SERVER"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set comments "INC0013410 - HR app rollout"
    next
end
