config firewall policy
    edit 1
        set name "Allow_Web_Outbound"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS"
        set comments "INC0012345 - web access for finance dept"
        set logtraffic all
    next
    edit 2
        set name "Allow_Finance_DB"
        set srcintf "internal"
        set dstintf "dmz"
        set srcaddr "FINANCE_SUBNET"
        set dstaddr "DB_SERVER_10"
        set action accept
        set schedule "always"
        set service "MSSQL"
        set comments "INC0012890 - finance app to DB access"
    next
    edit 3
        set name "Deny_All_Final"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set comments "default deny"
    next
end
